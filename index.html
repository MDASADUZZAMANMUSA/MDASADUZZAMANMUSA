<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Professional portfolio of Md. Asaduzzaman Musa, Network Engineer specializing in network infrastructure, fiber optics, CCTV and network operations.">
    <title>Md. Asaduzzaman Musa | Network Engineer</title>
    <style>
        :root{--navy:#0b1f3a;--blue:#1769e0;--blue2:#3d8bff;--pale:#eef5ff;--ink:#17263c;--muted:#61718a;--line:#dce6f4;--white:#fff;--bg:#f5f8fd}
        *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);line-height:1.65}
        a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:100vh;max-width:1440px;margin:auto}
        aside{background:linear-gradient(165deg,#0a1c35,#123c77);color:#fff;padding:30px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center}
        .avatar{width:118px;height:118px;border-radius:28px;object-fit:cover;border:4px solid #ffffff45;box-shadow:0 12px 32px #0003}.brand{font-weight:800;font-size:18px;margin:17px 0 0;text-align:center;line-height:1.25}.role{color:#b8d4ff;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;margin:9px 0 26px;text-align:center}
        nav{width:100%;display:grid;gap:7px}nav button{font:inherit;text-align:left;border:0;background:transparent;color:#dceaff;padding:12px 14px;border-radius:12px;cursor:pointer;font-weight:650;transition:.2s}nav button:hover,nav button.active{background:#ffffff18;color:#fff;box-shadow:inset 3px 0 var(--blue2)}.navicon{display:inline-block;width:26px;color:#8fbdff}.sidebottom{margin-top:auto;text-align:center;color:#b8c9e3;font-size:12px}.sidebottom a{color:#fff;text-decoration:underline}
        main{padding:36px clamp(22px,5vw,72px) 55px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.crumb{font-size:13px;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer;background:#fff;color:var(--navy);display:inline-flex;align-items:center;gap:8px}.btn.primary{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 6px 16px #1769e02a}.btn:hover{transform:translateY(-1px)}
        .page{display:none;animation:appear .25s ease}.page.active{display:block}@keyframes appear{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
        .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--blue);font-weight:800}.title{font-size:clamp(30px,4vw,46px);line-height:1.12;letter-spacing:-1.3px;color:var(--navy);margin:8px 0 13px}.lead{color:var(--muted);font-size:16px;max-width:750px}.rule{height:4px;width:56px;border-radius:9px;background:linear-gradient(90deg,var(--blue),#73b7ff);margin:18px 0 28px}
        .hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(190px,.65fr);align-items:center;gap:30px;background:linear-gradient(125deg,#fff,#edf5ff);border:1px solid #dce9fb;border-radius:25px;padding:clamp(24px,4vw,48px);box-shadow:0 14px 40px #153f7b08}.hero h1{font-size:clamp(32px,4vw,51px);letter-spacing:-1.8px;line-height:1.08;color:var(--navy);margin:12px 0}.hero h1 span{color:var(--blue)}.hero p{color:var(--muted);max-width:560px}.heroimg{width:min(100%,245px);aspect-ratio:4/5;object-fit:cover;object-position:center top;border-radius:24px;border:6px solid #fff;box-shadow:0 18px 38px #0b1f3a20;justify-self:center}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{font-size:12px;font-weight:700;padding:7px 10px;background:#e8f1ff;color:#174f9f;border:1px solid #d4e5ff;border-radius:8px}
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.stat strong{display:block;font-size:18px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}
        .sectionhead{margin-bottom:26px}.sectionhead .title{font-size:clamp(29px,3vw,38px)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card h3{margin:0 0 7px;color:var(--navy);font-size:17px}.card p{margin:0;color:var(--muted);font-size:14px}.iconbox{width:42px;height:42px;border-radius:12px;background:var(--pale);color:var(--blue);display:grid;place-items:center;font-size:19px;margin-bottom:13px}
        .info-list{display:grid;gap:0}.info-row{display:grid;grid-template-columns:145px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.info-row:last-child{border-bottom:0}.info-row strong{font-size:13px;color:var(--navy)}.info-row span{font-size:14px;color:var(--muted)}
        .skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.skill{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.skilltop{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:750;color:var(--navy);margin-bottom:10px}.track{height:7px;background:#e7edf6;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),#63adff);border-radius:10px}.note{margin-top:20px;padding:15px 17px;border-left:3px solid var(--blue);background:#eaf3ff;border-radius:0 12px 12px 0;color:#385274;font-size:13px}
        .timeline{display:grid;gap:16px}.job{display:grid;grid-template-columns:140px 1fr;gap:20px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px}.date{color:var(--blue);font-weight:800;font-size:12px;letter-spacing:.4px}.job h3{margin:0;color:var(--navy);font-size:17px}.company{font-size:13px;color:var(--muted);margin:3px 0 10px}.job ul{margin:8px 0 0;padding-left:18px;color:#52647c;font-size:13px}.job li{margin:5px 0}
        .projecttag{display:inline-block;margin:13px 5px 0 0;padding:5px 8px;border-radius:7px;background:#edf4ff;color:#1c58a8;font-size:11px;font-weight:750}.projectcard{display:flex;flex-direction:column;min-height:220px}.projectcard p{flex:1}.projectcard .iconbox{margin-bottom:12px}
        .contactgrid{display:grid;grid-template-columns:minmax(0,760px);gap:16px;justify-content:start}.contactprofile{display:flex;align-items:center;gap:18px;margin-bottom:18px;padding:18px;background:linear-gradient(120deg,#fff,#edf5ff);border:1px solid var(--line);border-radius:16px}.contactprofile img{width:88px;height:88px;object-fit:cover;object-position:center top;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 18px #0b1f3a18}.contactprofile h3{margin:0;color:var(--navy);font-size:20px}.contactprofile p{margin:4px 0 0;color:var(--muted);font-size:13px}.contactitem{display:flex;gap:13px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.contactitem:last-child{border-bottom:0}.contactitem .iconbox{flex-shrink:0;margin:0}.contactitem small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800}.contactitem a,.contactitem span{overflow-wrap:anywhere;font-size:14px;font-weight:650;color:var(--navy)}
        footer{padding-top:35px;color:#8290a4;font-size:11px;text-align:center}
        @media(max-width:850px){.shell{grid-template-columns:1fr}aside{position:relative;height:auto;padding:17px;display:grid;grid-template-columns:54px 1fr;column-gap:13px;align-items:center}.avatar{width:54px;height:54px;border-radius:15px;grid-row:span 2}.brand{text-align:left;margin:0;font-size:16px}.role{text-align:left;margin:3px 0 0;font-size:10px}nav{grid-column:1/-1;display:flex;overflow:auto;margin-top:14px;gap:5px}nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.navicon{width:auto;margin-right:6px}.sidebottom{display:none}main{padding:23px 18px 40px}.hero{grid-template-columns:1fr}.heroimg{grid-row:1;width:140px;aspect-ratio:1;justify-self:start;border-radius:50%}.stats,.grid3{grid-template-columns:1fr 1fr}.hero{gap:16px}}
        @media(max-width:560px){.grid2,.grid3,.skills,.contactgrid{grid-template-columns:1fr}.job{grid-template-columns:1fr;gap:6px}.info-row{grid-template-columns:110px 1fr}.topbar{align-items:flex-start;flex-direction:column}}
    </style>
</head>
<body>
    <div class="shell">
        <!-- Sidebar Navigation -->
        <aside>
            <!-- বামপাশের সাইডবারের ইমেজ পাথ ঠিক করা হলো -->
            <img src="profile.png" class="avatar" alt="Md. Asaduzzaman Musa">
            <div class="brand">Md. Asaduzzaman Musa</div>
            <div class="role">Network Engineer</div>
            <nav>
                <button class="active"><span class="navicon">⌂</span>About</button>
                <button><span class="navicon">✳</span>Skills</button>
                <button><span class="navicon">▤</span>Experience</button>
                <button><span class="navicon">◈</span>Projects</button>
                <button><span class="navicon">▣</span>Education</button>
                <button><span class="navicon">✉</span>Contact</button>
            </nav>
            <div class="sidebottom">
                <p>© 2026 Musa Portfolio</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main>
            <!-- Top Action Bar -->
            <div class="topbar">
                <div class="crumb">Dhaka, Bangladesh</div>
                <div class="actions">
                    <a href="https://linkedin.com" target="_blank" class="btn">LinkedIn Profile ↗</a>
                    <button class="btn primary" onclick="window.print()">Save Page as PDF</button>
                </div>
            </div>

            <!-- Page 1: About Me -->
            <div id="about" class="page active">
                <div class="eyebrow">Portfolio / About</div>
